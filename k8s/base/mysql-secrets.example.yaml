# Copy to mysql-secrets.yaml, sync passwords with secrets.yaml / .env, then:
#   kubectl apply -f k8s/base/mysql-secrets.yaml
# Bitnami MySQL chart requires keys: mysql-root-password, mysql-password
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-identity-secrets
  namespace: smartlend
type: Opaque
stringData:
  mysql-root-password: "123123"
  mysql-password: "123123"
---

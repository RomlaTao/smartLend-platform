apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-lend-redis
  namespace: smartlend
  labels:
    app: smart-lend-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-lend-redis
  template:
    metadata:
      labels:
        app: smart-lend-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: smart-lend-redis
  namespace: smartlend
  labels:
    app: smart-lend-redis
spec:
  selector:
    app: smart-lend-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

apiVersion: apps/v1
kind: Deployment
metadata:
  name: loanmanagementservice
  namespace: smartlend
  labels:
    app: loanmanagementservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loanmanagementservice
  template:
    metadata:
      labels:
        app: loanmanagementservice
    spec:
      containers:
        - name: loanmanagementservice
          image: smartlend/loanmanagementservice:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8008
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          envFrom:
            - configMapRef:
                name: smartlend-config
            - secretRef:
                name: smartlend-secrets
          resources:
            requests:
              memory: 384Mi
              cpu: 200m
            limits:
              memory: 768Mi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8008
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8008
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: loanmanagementservice
  namespace: smartlend
spec:
  selector:
    app: loanmanagementservice
  ports:
    - port: 8008
      targetPort: 8008

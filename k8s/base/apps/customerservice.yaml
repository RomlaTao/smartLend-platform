apiVersion: apps/v1
kind: Deployment
metadata:
  name: customerservice
  namespace: smartlend
  labels:
    app: customerservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customerservice
  template:
    metadata:
      labels:
        app: customerservice
    spec:
      containers:
        - name: customerservice
          image: smartlend/customerservice:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8006
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          envFrom:
            - configMapRef:
                name: smartlend-config
            - secretRef:
                name: smartlend-secrets
          resources:
            requests:
              memory: 384Mi
              cpu: 200m
            limits:
              memory: 768Mi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8006
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8006
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: customerservice
  namespace: smartlend
spec:
  selector:
    app: customerservice
  ports:
    - port: 8006
      targetPort: 8006

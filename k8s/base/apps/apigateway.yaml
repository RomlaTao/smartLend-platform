apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  namespace: smartlend
  labels:
    app: apigateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
    spec:
      containers:
        - name: apigateway
          image: smartlend/apigateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          envFrom:
            - configMapRef:
                name: smartlend-config
            - secretRef:
                name: smartlend-secrets
          resources:
            requests:
              memory: 384Mi
              cpu: 200m
            limits:
              memory: 768Mi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway
  namespace: smartlend
spec:
  selector:
    app: apigateway
  ports:
    - port: 8080
      targetPort: 8080

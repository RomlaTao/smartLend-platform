apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-model-service
  namespace: smartlend
  labels:
    app: ml-model-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-model-service
  template:
    metadata:
      labels:
        app: ml-model-service
    spec:
      containers:
        - name: ml-model-service
          image: smartlend/ml-model-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5000"
            - name: DEBUG
              value: "false"
          envFrom:
            - configMapRef:
                name: smartlend-config
            - secretRef:
                name: smartlend-secrets
          resources:
            requests:
              memory: 768Mi
              cpu: 200m
            limits:
              memory: 1536Mi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ml-model-service
  namespace: smartlend
spec:
  selector:
    app: ml-model-service
  ports:
    - port: 5000
      targetPort: 5000

apiVersion: apps/v1
kind: Deployment
metadata:
  name: identityservice
  namespace: smartlend
  labels:
    app: identityservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identityservice
  template:
    metadata:
      labels:
        app: identityservice
    spec:
      containers:
        - name: identityservice
          image: smartlend/identityservice:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
            # Until image rebuild: base properties use SPRING_RABBITMQ_* (ConfigMap has host/port; creds from secret)
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smartlend-secrets
                  key: RABBITMQ_USERNAME
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartlend-secrets
                  key: RABBITMQ_PASSWORD
          envFrom:
            - configMapRef:
                name: smartlend-config
            - secretRef:
                name: smartlend-secrets
          resources:
            requests:
              memory: 384Mi
              cpu: 200m
            limits:
              memory: 768Mi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8005
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8005
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: identityservice
  namespace: smartlend
spec:
  selector:
    app: identityservice
  ports:
    - port: 8005
      targetPort: 8005

# Copy to secrets.yaml — app secrets (JWT, RabbitMQ, JDBC passwords for Spring apps)
# MySQL Helm uses separate file: mysql-secrets.example.yaml → mysql-secrets.yaml
# NEVER commit secrets.yaml / mysql-secrets.yaml with real passwords.
apiVersion: v1
kind: Secret
metadata:
  name: smartlend-secrets
  namespace: smartlend
type: Opaque
stringData:
  # Spring apps (envFrom) — must match mysql-password in mysql-*-secrets
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_root"
  IDENTITY_DB_PASSWORD: "CHANGE_ME_identity"
  CUSTOMER_DB_PASSWORD: "CHANGE_ME_customer"
  PREDICTION_DB_PASSWORD: "CHANGE_ME_prediction"
  LOAN_MANAGEMENT_DB_PASSWORD: "CHANGE_ME_loan"
  JWT_SECRET: "CHANGE_ME_jwt_base64_secret"
  RABBITMQ_USERNAME: "smartlend"
  RABBITMQ_PASSWORD: "CHANGE_ME_rabbitmq"
  ADMIN_DEFAULT_EMAIL: "admin@example.com"
  ADMIN_DEFAULT_PASSWORD: "CHANGE_ME_admin"
  ADMIN_DEFAULT_ROLE: "ADMIN"
